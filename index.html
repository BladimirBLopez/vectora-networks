<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Termux</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        h1 {
            color: #58a6ff;
            font-size: 3rem;
            text-shadow: 0 0 20px #58a6ff55;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .terminal {
            background: #161b22;
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 0 30px #00000088;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #58a6ff;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>🚀 Termux App</h1>
        <p>$ echo "Hola, mundo desde Termux"</p>
        <p><span style="color:#58a6ff;">➜</span> Sistema listo <span class="cursor"></span></p>
    </div>
</body>
</html>
